// Lazy Firebase loader — injects CDN scripts and resolves when ready
function loadFirebase() {
  return new Promise((resolve, reject) => {
    if (window._fbDb) { resolve(window._fbDb); return; }
    const loadScript = (src) => new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    Promise.all([
      loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"),
      loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"),
    ]).then(() => {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      window._fbDb = firebase.firestore();
      resolve(window._fbDb);
    }).catch(reject);
  });
}

function makeDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const todayStr = () => makeDateStr(new Date());
const tomorrowStr = () => { const d = new Date(); d.setDate(d.getDate()+1); return makeDateStr(d); };
const formatDate = ds => { const d = new Date(ds+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}`; };

function getDayLabel(ds, t) {
  if (ds === todayStr()) return t.today;
  if (ds === tomorrowStr()) return t.tomorrow;
  return t.weekdays[jsToIdx(new Date(ds+"T00:00:00").getDay())];
}
function getWeekDates() {
  const now = new Date(), idx = jsToIdx(now.getDay()), mon = new Date(now);
  mon.setDate(now.getDate() - idx);
  return Array.from({length:7}, (_,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return makeDateStr(d); });
}
function getNextWeekDates() {
  return getWeekDates().map(ds => { const d = new Date(ds); d.setDate(d.getDate()+7); return makeDateStr(d); });
}
function getDeadline(ds) { const d = new Date(ds+"T00:00:00"); d.setHours(DEADLINE_HOUR,0,0,0); return d; }
const isPast = ds => new Date() > getDeadline(ds);

function useCountdown(ds) {
  const [ms, setMs] = useState(() => getDeadline(ds) - Date.now());
  useEffect(() => {
    const t = setInterval(() => setMs(getDeadline(ds) - Date.now()), 1000);
    return () => clearInterval(t);
  }, [ds]);
  return ms;
}
function fmtMs(ms) {
  if (ms <= 0) return null;
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${ss}s`;
  return `${ss}s`;
}

// Returns true if current Taiwan time (UTC+8) is Friday 00:00 or later
function isNextWeekUnlocked() {
  const now = new Date();
  // Taiwan is UTC+8
  const twOffset = 8 * 60; // minutes
  const twNow = new Date(now.getTime() + (twOffset + now.getTimezoneOffset()) * 60000);
  // getDay(): 0=Sun, 1=Mon, ..., 5=Fri, 6=Sat
  const day = twNow.getDay();
  // Unlocked from Friday 00:00 through the following Sunday 23:59
  return day === 5 || day === 6 || day === 0;
}

// Returns milliseconds until next Friday 00:00 Taiwan time
function msUntilFridayTW() {
  const now = new Date();
  const twOffset = 8 * 60;
  const twNow = new Date(now.getTime() + (twOffset + now.getTimezoneOffset()) * 60000);
  const day = twNow.getDay(); // 0=Sun..6=Sat
  // Days until Friday: Fri=0, Sat=6, Sun=5, Mon=4, Tue=3, Wed=2, Thu=1
  const daysUntilFri = day === 5 ? 7 : (5 - day + 7) % 7 || 7;
  const nextFri = new Date(twNow);
  nextFri.setDate(twNow.getDate() + daysUntilFri);
  nextFri.setHours(0, 0, 0, 0);
  // Convert back to UTC
  const nextFriUTC = new Date(nextFri.getTime() - (twOffset + now.getTimezoneOffset()) * 60000);
  return Math.max(0, nextFriUTC - now);
}

function useNextWeekUnlock() {
  const [unlocked, setUnlocked] = useState(isNextWeekUnlocked);
  const [ms, setMs] = useState(() => msUntilFridayTW());
  useEffect(() => {
    if (unlocked) return;
    const t = setInterval(() => {
      const remaining = msUntilFridayTW();
      setMs(remaining);
      if (remaining <= 0) setUnlocked(true);
    }, 1000);
    return () => clearInterval(t);
  }, [unlocked]);
  return { unlocked, ms };
}

function fmtCountdown(ms) {
  if (ms <= 0) return "";
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (h >= 24) {
    const d = Math.floor(h / 24);
    return `${d}天 ${h % 24}時`;
  }
  return `${h}時 ${m}分 ${ss}秒`;
}

  const { unlocked: nextWeekUnlocked, ms: unlockMs } = useNextWeekUnlock();

  const displayDates = week === "this" ? getWeekDates() : getNextWeekDates();
  const merged = useMemo(() => ({ ...schedule, ...draft }), [schedule, draft]);
  const hasDraft = Object.keys(draft).length > 0;

  const setDraft = (ds, val) => setDraftState(prev => ({ ...prev, [ds]: val }));

  const applyDraft = () => {
    setSchedule(prev => ({ ...prev, ...draft }));
    setDraftState({});
    setSavedToast(true);
    setTimeout(() => setSavedToast(false), 2000);

  return (
    <div className="space-y-4">

          本週

        {/* Next week — locked until Friday 00:00 TW */}

          onClick={() => nextWeekUnlocked && setWeek("next")}
          disabled={!nextWeekUnlocked}
          className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors flex flex-col items-center justify-center gap-0.5
            ${week === "next" && nextWeekUnlocked ? "bg-orange-500 text-white"
            : nextWeekUnlocked ? "bg-gray-800 text-gray-400 hover:bg-gray-700"
            : "bg-gray-800/50 text-gray-600 cursor-not-allowed"}`}>
          <span>下週</span>
          {!nextWeekUnlocked && (
            <span className="text-xs text-gray-500 leading-none">
              週五解鎖 · {fmtCountdown(unlockMs)}
            </span>
          )}
        </button>
      </div>

      {/* Next week locked notice */}
      {!nextWeekUnlocked && week === "next" && (
        <div className="bg-gray-800 border border-gray-700 rounded-xl p-4 text-center">
          <p className="text-gray-400 text-sm">下週排程將於週五台灣時間 00:00 開放編輯</p>

      {/* Day rows */}
      <div className="space-y-2">

          return (
            <div key={ds}

                isTod ? "border-orange-500/50 bg-orange-500/5"

              placeholder={t.itemNamePh} onKeyDown={e => e.key === "Enter" && addItem()}
              className="flex-1 bg-gray-800 text-white rounded-lg px-3 py-2 text-sm outline-none border border-gray-700 focus:border-orange-500 transition-colors"/>
            <input value={itemInput.price} onChange={e => setItemInput({...itemInput, price: e.target.value})}
              placeholder={t.itemPricePh} type="number" onKeyDown={e => e.key === "Enter" && addItem()}
              className="w-20 bg-gray-800 text-white rounded-lg px-3 py-2 text-sm outline-none border border-gray-700 focus:border-orange-500 transition-colors"/>
            <button onClick={addItem} className="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-orange-600 transition-colors">{t.addBtn}</button>
          </div>
        </div>
      </div>

      <button onClick={onSave} disabled={!data.name}
        className="w-full py-3 rounded-xl bg-orange-500 text-white font-bold hover:bg-orange-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
        {title === t.addTitle ? t.createBtn : t.saveBtn}
      </button>
    </div>
  );
}

// ─────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────
export default function App() {
  const [lang, setLang] = useState("zh");
  const t = LANGS[lang];

  // ── Firestore-backed shared state ─────────────────────────────
  const [loaded, setLoaded] = useState(false);
  const [fbError, setFbError] = useState(false);
  const [restaurants, setRestaurantsState] = useState(INITIAL_RESTAURANTS);
  const [schedule, setScheduleState] = useState({});
  const [orders, setOrdersState] = useState([]);
  const [orderHistory, setOrderHistoryState] = useState({});

  // Load Firebase and subscribe to all docs
  useEffect(() => {
    let unsubs = [];
    loadFirebase().then(db => {
      let done = 0;
      const checkDone = () => { done++; if (done === 4) setLoaded(true); };
      const sub = (docId, setter, fallback) => {
        const ref = db.collection("appdata").doc(docId);
        const unsub = ref.onSnapshot(snap => {
          if (snap.exists) setter(snap.data().value ?? fallback);
          checkDone();
        }, () => checkDone());
        unsubs.push(unsub);
      };
      sub("restaurants", setRestaurantsState, INITIAL_RESTAURANTS);
      sub("schedule",    setScheduleState,    {});
      sub("orders",      setOrdersState,      []);
      sub("orderHistory",setOrderHistoryState,{});
    }).catch(() => {
      setFbError(true);
      setLoaded(true);
    });
    return () => unsubs.forEach(u => u());
  }, []);

  // Firestore write helper
  const fbSet = (docId, value) => {
    if (!window._fbDb) return;
    window._fbDb.collection("appdata").doc(docId).set({ value }).catch(() => {});
  };

  // Wrapped setters — update local state + write to Firestore
  const setRestaurants = useCallback((updater) => {
    setRestaurantsState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      fbSet("restaurants", next);
      return next;
    });
  }, []);

  const setSchedule = useCallback((updater) => {
    setScheduleState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      fbSet("schedule", next);
      return next;
    });
  }, []);

  const setOrders = useCallback((updater) => {
    setOrdersState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      fbSet("orders", next);
      return next;
    });
  }, []);

  const setOrderHistory = useCallback((updater) => {
    setOrderHistoryState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      fbSet("orderHistory", next);
      return next;
    });
  }, []);

  // Loading / error screen
  if (!loaded) return (

  if (fbError) return (

        <p className="text-red-500 font-bold mb-2">連線失敗</p>
        <p className="text-gray-500 text-sm">無法連接 Firebase，請確認網路並重新整理頁面</p>

                            </p>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            {sel && <button onClick={() => setQty(item.id,-1)} className="w-7 h-7 rounded-full text-white font-bold text-lg flex items-center justify-center" style={{background: activeRestaurant.color}}>−</button>}
                            {sel && <span className="w-5 text-center font-bold text-sm tabular-nums">{qty}</span>}
                            <button onClick={() => setQty(item.id,1)} className={`w-7 h-7 rounded-full font-bold text-lg flex items-center justify-center transition-colors ${sel ? "text-white" : "bg-gray-100 text-gray-500 hover:bg-gray-200"}`} style={sel ? {background: activeRestaurant.color} : {}}>+</button>
                          </div>
                        </div>
                        {sel && (
                          <div className="px-3 pb-2.5 space-y-1.5">
                            {Array.from({length: qty}, (_, i) => (
                              <div key={i} className="flex items-center gap-1.5">
                                {qty > 1 && <span className="text-xs text-gray-400 shrink-0 w-4 text-center">{i+1}</span>}
                                <input
                                  value={noteSlots[i] || ""}
                                  onChange={e => {
                                    const newNotes = [...(cart[item.id]?.notes || Array(qty).fill(""))];
                                    newNotes[i] = e.target.value;
                                    setCart(prev => ({...prev, [item.id]: {...prev[item.id], notes: newNotes}}));
                                  }}
                                  placeholder={t.notePlaceholder}
                                  className="flex-1 text-xs border border-gray-200 rounded-lg px-2.5 py-1.5 outline-none focus:border-orange-300 bg-white"/>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  };

                  return (
                    <div className="space-y-1.5">
                      {/* Bento / main items */}
                      {mainItems.length > 0 && (
                        <div>
                          <div className="flex items-center gap-2 mb-2">
                            <div className="h-px flex-1 bg-gray-100"/>
                            <span className="text-xs text-gray-400 font-medium px-1">便當 / 正餐</span>
                            <div className="h-px flex-1 bg-gray-100"/>
                          </div>
                          <div className="space-y-1.5">{mainItems.map(renderItem)}</div>
                        </div>
                      )}

                      {/* Single-order items */}
                      {singleItems.length > 0 && (
                        <div className="mt-3">
                          <div className="flex items-center gap-2 mb-2">
                            <div className="h-px flex-1 bg-blue-100"/>
                            <span className="text-xs text-blue-400 font-medium px-1">單點</span>
                            <div className="h-px flex-1 bg-blue-100"/>
                          </div>
                          <div className="space-y-1.5">{singleItems.map(renderItem)}</div>
                        </div>
                      )}

                      {/* Cancel order option */}
                      <div className="mt-3">
                        <div className="flex items-center gap-2 mb-2">
                          <div className="h-px flex-1 bg-gray-100"/>
                          <span className="text-xs text-gray-300 font-medium px-1">其他</span>
                          <div className="h-px flex-1 bg-gray-100"/>
                        </div>
                        <div className={`rounded-xl border transition-all overflow-hidden ${cart[CANCEL_ORDER_ID] ? "border-red-400 bg-red-50" : "border-dashed border-gray-200 bg-gray-50"}`}>
                          <div className="flex items-center px-3 py-2.5 gap-2">
                            <div className="flex-1 min-w-0">
                              <p className={`font-medium text-sm ${cart[CANCEL_ORDER_ID] ? "text-red-600" : "text-gray-400"}`}>{t.cancelOrderItem}</p>
                              <p className="text-xs text-gray-400 mt-0.5">{t.cancelOrderNote}</p>
                            </div>
                            <button
                              onClick={() => {
                                if (cart[CANCEL_ORDER_ID]) { setCart(prev => { const {[CANCEL_ORDER_ID]:_,...rest}=prev; return rest; }); }
                                else { setCart({ [CANCEL_ORDER_ID]: { qty:1, notes:[] } }); }
                              }}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${cart[CANCEL_ORDER_ID] ? "bg-red-500 text-white" : "bg-gray-200 text-gray-500 hover:bg-gray-300"}`}>
                              {cart[CANCEL_ORDER_ID] ? "✓ 已選擇" : "選擇"}
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>

              {/* Cart */}
              {cartCount > 0 && (
                <div className="bg-white rounded-2xl border border-gray-100 p-4">
                  <p className="text-xs text-gray-400 font-medium mb-2">{t.yourOrder}</p>
                  <div className="space-y-1.5">
                    {Object.entries(cart).map(([id,v]) => {
                      const item = activeRestaurant.items.find(i => i.id === Number(id)); if (!item) return null;
                      return (
                        <div key={id} className="flex justify-between text-sm">
                          <span className="text-gray-700 min-w-0 mr-2">{getItemName(item,lang)} <span className="text-gray-400">×{v.qty}</span>{v.note && <span className="text-orange-400 text-xs ml-1">· {v.note}</span>}</span>
                          <span className="font-bold shrink-0" style={{color: activeRestaurant.color}}>NT${item.price*v.qty}</span>
                        </div>
                      );
                    })}
                    <div className="border-t border-gray-100 pt-2 flex justify-between font-bold text-sm">
                      <span className="text-gray-600">{t.subtotal}</span>
                      <span style={{color: activeRestaurant.color}}>NT${cartTotal}</span>
                    </div>
                  </div>
                </div>
              )}

              <button onClick={() => setShowConfirm(true)} disabled={!personName || (cartCount === 0 && !cart[CANCEL_ORDER_ID])}
                className={`w-full py-3.5 rounded-xl text-white font-bold shadow-sm disabled:opacity-40 disabled:cursor-not-allowed hover:opacity-90 transition-opacity text-sm ${cart[CANCEL_ORDER_ID] ? "bg-red-500 hover:bg-red-600" : ""}`}
                style={cart[CANCEL_ORDER_ID] ? {} : {background: activeRestaurant.color}}>
                {cart[CANCEL_ORDER_ID] ? t.cancelOrderItem : cartCount === 0 ? t.selectFirst : t.submit(cartCount)}
              </button>
            </div>
          )}
        </div>

        <div className="text-center pb-8">
          <button onClick={() => setShowAdminLogin(true)} className="text-gray-300 text-xs hover:text-gray-500 transition-colors">管理員入口</button>
        </div>
      </div>
    );
  }

  // ──────────────────────────────────────────
  // ADMIN VIEW — always Chinese regardless of user lang
  // ──────────────────────────────────────────
  const adminT = LANGS.zh; // fixed Chinese for all admin UI
  const ConfirmActionModal = () => confirmModal ? (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 px-4"
      onClick={() => setConfirmModal(null)}>
      <div className="bg-gray-900 border border-gray-700 rounded-2xl p-5 w-full max-w-xs shadow-2xl" onClick={e => e.stopPropagation()}>
        <p className="text-white text-sm font-medium mb-4 text-center leading-relaxed">{confirmModal.message}</p>
        <div className="flex gap-2">
          <button onClick={() => setConfirmModal(null)}
            className="flex-1 py-2.5 rounded-xl border border-gray-700 text-gray-400 text-sm hover:bg-gray-800 transition-colors">
            取消
          </button>
          <button onClick={() => { confirmModal.onConfirm(); setConfirmModal(null); }}
            className="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition-colors">
            確認
          </button>
        </div>
      </div>
    </div>
  ) : null;
  return (
    <div className="min-h-screen bg-gray-950" style={{fontFamily:"'Noto Sans TC','PingFang TC',sans-serif"}}>
      <ConfirmActionModal/>
      <div className="bg-gray-900 border-b border-gray-800">
        <div className="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
          <span className="text-white font-bold text-sm shrink-0">管理後台</span>
          <div className="flex items-center gap-2">
            <button onClick={() => setIsAdmin(false)} className="text-gray-400 hover:text-white text-xs px-3 py-1.5 rounded-lg border border-gray-700 transition-colors whitespace-nowrap">前往點餐頁</button>
            <button onClick={() => setIsAdmin(false)} className="text-gray-600 hover:text-red-400 text-xs transition-colors whitespace-nowrap">登出</button>
          </div>
        </div>
        <div className="max-w-2xl mx-auto px-4 flex gap-0">
          {[["schedule","餐廳排程"],["restaurants","餐廳管理"],["orders","訂單總覽"]].map(([key,label]) => (
            <button key={key} onClick={() => { setAdminSection(key); setEditingRest(null); setAddingRest(false); }}
              className={`px-5 py-2.5 text-sm font-medium whitespace-nowrap border-b-2 transition-all ${adminSection === key ? "border-orange-500 text-orange-400" : "border-transparent text-gray-500 hover:text-gray-300"}`}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 py-5 space-y-4">

        {/* SCHEDULE — uses separate component, no hooks-in-conditions issue */}
        {adminSection === "schedule" && (
          <AdminSchedule schedule={schedule} setSchedule={setSchedule} restaurants={restaurants} orders={orders} t={adminT}/>
        )}

        {/* RESTAURANTS */}
        {adminSection === "restaurants" && !editingRest && !addingRest && (
          <div className="space-y-2">
            {restaurants.map(r => (
              <div key={r.id} className="bg-gray-900 border border-gray-800 rounded-xl p-4 flex items-center gap-3">
                <div className="w-1 h-10 rounded-full shrink-0" style={{background: r.color}}/>
                <div className="flex-1 min-w-0">
                  <p className="text-white font-bold text-sm truncate">{r.name}</p>
                  <p className="text-gray-500 text-xs truncate">{r.items.length} {adminT.dishes} · {r.minDelivery ? `${adminT.minDelivery}: ${r.minDelivery}` : adminT.notArranged}</p>
                </div>
                <div className="flex gap-1 shrink-0">
                  <button onClick={() => setEditingRest({...r, items: r.items.map(i => ({...i}))})} className="text-gray-500 hover:text-orange-400 text-xs px-3 py-1.5 rounded-lg hover:bg-gray-800 transition-colors">{adminT.editBtn}</button>
                  <button onClick={() => deleteRest(r.id)} className="text-gray-600 hover:text-red-400 text-xs px-3 py-1.5 rounded-lg hover:bg-gray-800 transition-colors">{adminT.deleteBtn}</button>
                </div>
              </div>
            ))}
            <button onClick={() => setAddingRest(true)} className="w-full py-3 rounded-xl border border-dashed border-gray-700 text-gray-500 hover:text-white hover:border-orange-500/50 transition-all text-sm">{adminT.addRestaurant}</button>
          </div>
        )}
        {adminSection === "restaurants" && addingRest && (
          <RestaurantForm title={adminT.addTitle} data={newRest} setData={setNewRest} itemInput={newItemInput} setItemInput={setNewItemInput} onSave={saveNewRest} onCancel={() => setAddingRest(false)} t={adminT}/>
        )}
        {adminSection === "restaurants" && editingRest && (
          <RestaurantForm title={adminT.editTitle} data={editingRest} setData={setEditingRest} itemInput={editItemInput} setItemInput={setEditItemInput} onSave={saveEditRest} onCancel={() => setEditingRest(null)} t={adminT}/>
        )}

        {/* ORDERS */}
        {adminSection === "orders" && (
          <div className="space-y-4">
            {scheduledDatesWithOrders.length > 0 ? (
              <>
                <div className="flex gap-1.5 overflow-x-auto pb-1">
                  {scheduledDatesWithOrders.map(ds => {
                    const r = restaurants.find(x => x.id === schedule[ds]);
                    const cnt = orders.filter(o => o.dateStr === ds).length;
                    const active = adminOrdersDate === ds;
                    return (
                      <button key={ds} onClick={() => setAdminOrdersDate(ds)}
                        className={`shrink-0 flex flex-col items-center px-3 py-2 rounded-xl border transition-all min-w-14 ${active ? "border-current text-white" : "border-gray-800 bg-gray-900 text-gray-400 hover:bg-gray-800"}`}
                        style={active ? { background: r?.color||"#E67E22", borderColor: r?.color } : {}}>
                        <span className={`text-xs font-bold ${active ? "text-white" : "text-gray-300"}`}>{getDayLabel(ds, adminT)}</span>
                        <span className={`text-xs ${active ? "text-white/70" : "text-gray-600"}`}>{formatDate(ds)}</span>
                        {cnt > 0 && <span className={`text-xs mt-0.5 font-bold ${active ? "text-white" : "text-orange-400"}`}>{cnt}</span>}
                      </button>
                    );
                  })}
                </div>

                {(() => {
                  const dateOrders = orders.filter(o => o.dateStr === adminOrdersDate);
                  const r = restaurants.find(x => x.id === schedule[adminOrdersDate]);
                  const dateTotal = dateOrders.filter(o=>!o.cancelled).reduce((s,o) => s+o.total, 0);
                  const dateTotalQty = dateOrders.filter(o=>!o.cancelled).reduce((s,o) =>
                    s + o.lines.reduce((ls,l) => {
                      if (l.item.id === CANCEL_ORDER_ID) return ls;
                      const restItem = r?.items?.find(i => i.id === l.item.id);
                      return restItem?.singleOrder ? ls : ls + l.qty;
                    }, 0), 0);

                  if (dateOrders.length === 0) return (
                    <div className="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center text-gray-600 text-sm">{adminT.ordersEmpty}</div>
                  );

                  const itemMap = {};
                  dateOrders.forEach(o => {
                    if (o.cancelled) return;
                    o.lines.forEach(l => {
                      if (l.item.id === CANCEL_ORDER_ID) return;
                      const k = l.item.id;
                      if (!itemMap[k]) itemMap[k] = { item: l.item, count: 0, noteDetails: [] };
                      itemMap[k].count += l.qty;
                      // Collect per-unit notes
                      const notes = l.notes || (l.note ? [l.note] : []);
                      notes.forEach((n, i) => {
                        if (n) itemMap[k].noteDetails.push({ person: o.person, unitIdx: i+1, note: n, totalQty: l.qty });
                      });
                    });
                  });

                  // Sort: active orders first, cancelled last
                  const sortedOrders = [...dateOrders].sort((a,b) => {
                    if (a.cancelled && !b.cancelled) return 1;
                    if (!a.cancelled && b.cancelled) return -1;
                    return 0;
                  });

                  return (
                    <div className="space-y-3">
                      {/* Single unified card: stats + people + total */}
                      <div className="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
                        {/* Header */}
                        <div className="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
                          <p className="text-xs text-gray-400 font-medium">
                            {getDayLabel(adminOrdersDate, adminT)} {r && `· ${r.name}`}
                          </p>
                          <div className="flex items-center gap-3">
                            <span className="text-xs text-gray-500">{dateOrders.filter(o=>!o.cancelled).length} 筆</span>
                            <span className="text-xs text-orange-300 font-bold">{dateTotalQty} 份</span>
                            <span className="text-lg font-bold text-white">NT${dateTotal}</span>
                          </div>
                        </div>

                        {/* Item summary with notes */}
                        <div className="px-4 py-2.5 border-b border-gray-800">
                          <p className="text-xs text-gray-600 mb-2">{adminT.statTitle}</p>
                          <div className="space-y-2">
                            {Object.values(itemMap).map(({item, count, noteDetails}) => (
                              <div key={item.id}>
                                {/* Main row: item name + total count */}
                                <div className="flex items-center gap-1.5">
                                  <span className="text-white text-sm font-medium">{getItemName(item, "zh")}</span>
                                  <span className="bg-orange-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full leading-none">×{count}</span>
                                  {item.singleOrder && <span className="text-blue-400 text-xs border border-blue-700 px-1 rounded leading-none">單點</span>}
                                </div>
                                {/* Per-unit notes — clearly subordinate */}
                                {noteDetails.length > 0 && (
                                  <div className="mt-1 ml-3 space-y-0.5 border-l-2 border-gray-700 pl-2">
                                    {noteDetails.map((nd,i) => (
                                      <div key={i} className="flex items-baseline gap-1">
                                        <span className="text-gray-500 text-xs shrink-0">
                                          {nd.person}{nd.totalQty > 1 ? ` 第${nd.unitIdx}份` : ""}：
                                        </span>
                                        <span className="text-amber-300 text-xs">{nd.note}</span>
                                        <span className="text-gray-600 text-xs shrink-0">×1</span>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Per-person rows */}
                        <div className="divide-y divide-gray-800">
                          {sortedOrders.map(o => {
                            const histKey = `${adminOrdersDate}__${o.person.trim()}`;
                            const hist = orderHistory[histKey];
                            return (
                              <div key={o.id} className={`px-4 py-2.5 ${o.cancelled ? "opacity-60" : ""}`}>
                                <div className="flex items-center justify-between mb-1">
                                  <div className="flex items-center gap-1.5 min-w-0">
                                    <div className="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                                      style={{background: o.cancelled ? "#6B7280" : (r?.color||"#E67E22"), fontSize:"10px"}}>{o.person[0]}</div>
                                    <span className={`text-xs font-bold truncate ${o.cancelled ? "line-through text-gray-500" : "text-white"}`}>{o.person}</span>
                                    <span className="text-gray-600 text-xs shrink-0">{o.time}</span>
                                    {o.cancelled && <span className="text-red-400 text-xs shrink-0 font-medium">{adminT.cancelledLabel}</span>}
                                    {hist && !o.cancelled && <span className="text-amber-400 text-xs shrink-0 font-medium">{adminT.editedLabel}</span>}
                                  </div>
                                  <div className="flex items-center gap-2 shrink-0">
                                    {!o.cancelled && <span className="text-orange-400 font-bold text-xs">NT${o.total}</span>}
                                    <button onClick={() => setConfirmModal({ message: adminT.confirmDeleteOrder(o.person), onConfirm: () => setOrders(prev => prev.filter(x => x.id !== o.id)) })} className="text-gray-700 hover:text-red-400 text-base leading-none w-4 text-center">×</button>
                                  </div>
                                </div>
                                <p className={`text-xs pl-6 leading-relaxed ${o.cancelled ? "text-red-400/70 line-through" : "text-gray-500"}`}>
                                  {o.cancelled ? adminT.cancelOrderItem : o.lines.map((l,i) => {
                                    const notes = l.notes || (l.note ? [l.note] : []);
                                    const hasNotes = notes.some(n => n);
                                    return (
                                      <span key={i}>
                                        {i>0?"、":""}{getItemName(l.item, "zh")} ×{l.qty}
                                        {hasNotes && notes.map((n,j) => n ? (
                                          <span key={j} className="text-amber-400 font-medium"> [{l.qty>1?`${j+1}.`:""}{n}]</span>
                                        ) : null)}
                                      </span>
                                    );
                                  })}
                                </p>
                                {hist && (
                                  <div className="pl-6 mt-1.5 space-y-1">
                                    <p className="text-amber-500/70 text-xs">{adminT.editHistory}:</p>
                                    {hist.map((h,i) => (
                                      <div key={i} className="text-gray-600 text-xs pl-2 border-l border-gray-700">
                                        <span className="text-gray-500 mr-1">{h.time}:</span>
                                        {h.prevCancelled ? <span className="text-red-400/60">{adminT.cancelOrderItem}</span>
                                          : h.prevLines?.map((l,j) => (
                                            <span key={j}>{j>0?"、":""}{getItemName(l.item, "zh")} ×{l.qty}</span>
                                          ))}
                                        {!h.prevCancelled && <span className="text-gray-600 ml-1">(NT${h.prevTotal})</span>}
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <button onClick={() => setConfirmModal({ message: adminT.confirmClear(getDayLabel(adminOrdersDate, adminT)), onConfirm: () => setOrders(prev => prev.filter(o => o.dateStr !== adminOrdersDate)) })}
                        className="w-full py-2.5 rounded-xl border border-red-900/50 text-red-500 text-sm hover:bg-red-900/20 transition-colors">
                        {adminT.clearDay}
                      </button>
                    </div>
                  );
                })()}
              </>
            ) : (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center text-gray-600 text-sm">{adminT.noScheduleYet}</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
